# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: langgraph-underwriting-foundry-hosted
services:
    backend:
        project: ../../backend
        host: containerapp
        language: python
        docker:
            remoteBuild: true
    frontend:
        project: ../../frontend
        host: containerapp
        language: js
        docker:
            remoteBuild: true
        uses:
            - backend
    underwriting-hosted:
        project: ./agent
        host: azure.ai.agent
        language: docker
        env:
            AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
            DATABASE_URL: $${{connections.underwritingruntimesecrets.credentials.database_url}}
            DB_AUTH_MODE: password
            DB_SCHEMA_MANAGED_EXTERNALLY: ${DB_SCHEMA_MANAGED_EXTERNALLY}
            ENABLE_INSTRUMENTATION: ${ENABLE_INSTRUMENTATION}
            ENABLE_TELEMETRY: ${ENABLE_TELEMETRY}
            OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
            OTEL_SERVICE_NAME: underwriting-hosted
            RUNTIME_DATABASE_URL: $${{connections.underwritingruntimesecrets.credentials.database_url}}
            UNDERWRITING_APPINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
            UNDERWRITING_MODEL_DEPLOYMENT_NAME: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Underwriting LangGraph hosted workflow agent.
        kind: hosted
        name: underwriting-hosted
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: python -m foundry.main
infra:
    provider: bicep
    path: ./iac
