services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: underwriting
      POSTGRES_USER: underwriting
      POSTGRES_PASSWORD: underwriting
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - underwriting_langgraph_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U underwriting -d underwriting"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres-bootstrap:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m app.sql.bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: underwriting
      DB_USER: underwriting
      DB_PASSWORD: underwriting
      DB_SSLMODE: disable
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: underwriting
      DB_USER: underwriting
      DB_PASSWORD: underwriting
      DB_SCHEMA_MANAGED_EXTERNALLY: "false"
      LOG_LEVEL: INFO
      FRONTEND_ORIGIN: http://localhost:4173
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      NGINX_API_UPSTREAM: http://backend:8000
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4173:80"

volumes:
  underwriting_langgraph_pgdata:
