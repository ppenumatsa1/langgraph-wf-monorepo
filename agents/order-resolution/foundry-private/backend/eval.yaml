name: order-resolution-quality
metadata:
  runtime: langgraph
  graph: order_resolution
  deployment_lane: foundry-private
  persistence: async_postgres
  strict_msgpack: true
  schema_version: 2
  interrupt_reconciliation: graph_authoritative
  max_unresolved_interrupts_per_thread: 1
dataset:
  local_uri: .foundry/datasets/order-resolution-private-hosted-cases.jsonl
  format: responses-2.0
  metadata_version: 2
agent:
  name: order-resolution-private-hosted
evaluators:
  - task_completion
  - task_adherence
  - intent_resolution
  - relevance
foundry:
  name: order-resolution-foundry-private-report
  report_only: true
  max_queries: 10
  poll_interval: 5
  timeout: 1800
  evaluators:
    - task_completion
    - coherence
  workflow_evaluation:
    evidence_file: .foundry/results/hosted-e2e-evidence.json
    max_workflows: 10
options:
  pass_threshold: 0.8
