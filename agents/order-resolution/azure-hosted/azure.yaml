# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: langgraph-order-resolution-azure-hosted
services:
  backend:
    project: ./backend
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
  frontend:
    project: ./frontend
    host: containerapp
    language: js
    docker:
      path: Dockerfile
      context: .
      remoteBuild: true
    uses:
      - backend
infra:
  provider: bicep
  path: ./infra/azure-apphosted/iac
